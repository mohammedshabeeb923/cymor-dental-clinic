<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pediaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#F0F9F9"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>
    <linearGradient id="pediaBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00666C"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="400" fill="url(#pediaBg)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.3" stroke="#99D5D6" stroke-width="1" stroke-dasharray="4 4">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
    <line x1="512" y1="0" x2="512" y2="400"/>
  </g>

  <!-- Inner Subtle Frame -->
  <rect x="24" y="24" width="592" height="352" rx="16" fill="none" stroke="#00666C" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35"/>

  <!-- Central Icon Emblem -->
  <g transform="translate(320, 155)">
    <circle r="48" fill="#FFFFFF" filter="drop-shadow(0 6px 16px rgba(0, 102, 108, 0.12))"/>
    <circle r="40" fill="#E6F4F4"/>

    <!-- Gentle Smiling Tooth Graphic -->
    <path d="M0 -20 C-13 -20 -20 -12 -20 2 C-20 13 -15 24 -10 33 C-7 38 -3 38 -2 30 C-1 22 0 15 0 15 C0 15 1 22 2 30 C3 38 7 38 10 33 C15 24 20 13 20 2 C20 -12 13 -20 0 -20 Z" fill="url(#pediaBrand)"/>
    <!-- Child friendly sparkle glint -->
    <circle cx="7" cy="-9" r="2.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="-5" cy="-2" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="320" y="245" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#00666C" text-anchor="middle" letter-spacing="1.5">
    PEDIATRIC DENTISTRY
  </text>
  <text x="320" y="272" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#BA0222" text-anchor="middle" letter-spacing="1">
    IMAGE PLACEHOLDER
  </text>
  <text x="320" y="296" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">
    CYMOR Super Speciality Dental Clinic
  </text>
  <text x="320" y="322" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Replace with /images/services/pediatric-dentistry.webp
  </text>
</svg>
